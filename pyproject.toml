[project]
name = "glance-data"
version = "0.1.0"
description = "Grounding data: diagnosis, augmentation and validation (data only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Vision-Decision" }]
keywords = ["visual-grounding", "referring-expressions", "refcoco", "coco", "dataset", "hard-negatives"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3"]
probe = ["scikit-learn>=1.3"]   # only for the text-only gate (glance_data.twins.gate)

[project.urls]
Homepage = "https://github.com/Vision-Decision/Glance-Data"
Dataset = "https://huggingface.co/datasets/Vision-Decision/Glance-Data"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["glance_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E401", "E501", "E701", "E702", "E731"]  # long prompt strings; keep code lines ~120
